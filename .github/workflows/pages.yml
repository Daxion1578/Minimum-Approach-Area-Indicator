# ブラウザ版（サーバ無し）を GitHub Pages に公開する。main に push するたびに組み直す。
# 計算は見る人のブラウザの中（Pyodide）で、サーバ版と同じ Python コードが行う。Claude は呼ばない。
# lab-camera-ar ブランチの web/ から AR の試作ページ（ar.html）を同じサイトの /web/ の下に残す。
# web/lab/（カメラ映像から充電部の候補を探す実験）は設計原則を外した実験なので載せない。
# lab-camera-ar だけを更新したときは、Actions の「pages」→「Run workflow」で組み直す。
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AR の試作ページ（lab-camera-ar の web/）を取ってくる
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: lab-camera-ar
          path: _keep
          sparse-checkout: web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ブラウザ版を組む
        run: python scripts/build_pages.py --out _site --keep-web _keep/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
