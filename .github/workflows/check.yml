# push のたびに GitHub 上でテスト・公開前チェック・通しの確認を回す。
# 結果は Actions の各実行の「Summary」に表で出る（スマホの GitHub アプリでも読める）。
# Claude は呼ばない（MAAI_OFFLINE=1、キーも置かない）。
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MAAI_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: テスト
        run: python -m pytest -q
      - name: 公開前チェック
        run: python scripts/public_safety_check.py --all
      - name: 通しの確認（図面取込 → 停止ステップ → 離隔判定 → 修正案 → 承認）
        run: python scripts/check_demo.py --out "$GITHUB_STEP_SUMMARY"
